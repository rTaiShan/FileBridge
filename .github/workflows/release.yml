name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
          CGO_ENABLED: "0"
        run: go build -o filebridge-windows-amd64.exe ./cmd/filebridge

      - name: Package source archive
        run: git archive --format=tar.gz --output filebridge-source.tar.gz HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}
          name: FileBridge release ${{ github.run_number }}
          generate_release_notes: true
          files: |
            filebridge-source.tar.gz
            filebridge-windows-amd64.exe
